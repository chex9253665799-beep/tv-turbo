name: Сборка APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon

      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk TvTurbo.apk

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: TvTurbo
          path: TvTurbo.apk

      - name: Выложить в релиз «latest»
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ТВ Турбо (последняя сборка)
          prerelease: false
          make_latest: true
          files: TvTurbo.apk
