name: Сборка APK

on:
  push:
    branches: [ main, mivision, feature/turbo-home-launcher-v1 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (уже есть на сервере)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ls $ANDROID_SDK_ROOT/platforms | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle :app:assembleDebug :turbohome:assembleDebug --no-daemon

      - name: Переименовать
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TvTurbo.apk
          cp turbohome/build/outputs/apk/debug/turbohome-debug.apk TurboHome.apk

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: TvTurbo
          path: |
            TvTurbo.apk
            TurboHome.apk

      # сначала файл, потом номер версии — иначе ТВ успевает скачать старый файл под новым номером
      - name: Выложить файл в релиз «latest»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          prerelease: false
          make_latest: true
          files: |
            TvTurbo.apk
            TurboHome.apk

      - name: Объявить новую версию
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ТВ Турбо (последняя сборка)
          body: |
            versionCode=${{ github.run_number }}
            ${{ github.event.head_commit.message }}
          prerelease: false
          make_latest: true

      - name: Тестовая сборка (ветка mivision) — отдельный релиз, автообновление его не видит
        if: github.ref == 'refs/heads/mivision'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mivision
          name: MiVision TV (тест)
          prerelease: true
          make_latest: false
          files: TvTurbo.apk

      - name: Опубликовать тестовый Turbo Home без изменения рабочего ТВ Турбо
        if: github.ref == 'refs/heads/feature/turbo-home-launcher-v1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: turbohome-preview
          name: Turbo Home — тестовая версия (Android TV)
          body: |
            Экспериментальный APK. Не заменяет CleanYourTV и не является обновлением ТВ Турбо.
            Сначала установи и открой Turbo Home из списка приложений, не выбирая его главным экраном.
          prerelease: true
          make_latest: false
          files: TurboHome.apk
