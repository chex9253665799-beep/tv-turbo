name: Сборка APK

on:
  push:
    branches: [ main, mivision ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Android SDK (уже есть на сервере)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ls $ANDROID_SDK_ROOT/platforms | tail -3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Собрать APK
        run: gradle assembleDebug --no-daemon

      - name: Переименовать
        run: cp app/build/outputs/apk/debug/app-debug.apk TvTurbo.apk

      - name: Сохранить как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: TvTurbo
          path: TvTurbo.apk

      - name: Выложить в релиз «latest»
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: ТВ Турбо (последняя сборка)
          body: |
            versionCode=${{ github.run_number }}
            ${{ github.event.head_commit.message }}
          prerelease: false
          make_latest: true
          files: TvTurbo.apk

      - name: Тестовая сборка (ветка mivision) — отдельный релиз, автообновление его не видит
        if: github.ref == 'refs/heads/mivision'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mivision
          name: MiVision TV (тест)
          prerelease: true
          make_latest: false
          files: TvTurbo.apk
